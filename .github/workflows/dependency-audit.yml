name: Node dependency maintenance

'on':
  schedule:
  - cron: '0 2 * * 1'
  - cron: '0 2 1 */3 *'
  workflow_dispatch:
    inputs:
      audit-kind:
        description: Security fixes only, or security plus routine upgrades for this run.
        type: choice
        default: security
        options:
        - security
        - upgrades
  push:
    branches:
    - main
    paths:
    - '**/pnpm-lock.yaml'
    - '**/package-lock.json'
    - '.github/node-maintenance.json'

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false
  queue: max

jobs:
  maintenance:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: hydra-ecosystem/github-actions/.github/workflows/node-maintenance.yml@0938f9298b84dd6741a394fc2db8dfd6e04942a7
    with:
      audit-kind: ${{ inputs.audit-kind || 'auto' }}
      app-client-id: ${{ vars.NODE_AUDIT_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.NODE_AUDIT_APP_PRIVATE_KEY }}
