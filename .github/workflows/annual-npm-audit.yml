name: Annual documentation dependency audit

on:
  schedule:
    - cron: '0 2 30 1 *'  # January 30, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: annual-website-dependencies
  cancel-in-progress: false

env:
  WEBSITE_PROJECT: website

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate manual dispatch ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "::error::Manual dispatch must target the repository default branch ($expected_ref); got $GITHUB_REF." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable the project's pinned pnpm
        run: corepack enable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install audit report parser
        run: python -m pip install PyYAML==6.0.3
      - name: Test the audit helper and publisher
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest .github/scripts/test_annual_npm_audit.py -q
      - name: Audit, propose upgrades, and build
        run: |
          python .github/scripts/annual_npm_audit.py --directory "$WEBSITE_PROJECT" --report "$RUNNER_TEMP/annual-npm-audit-pr.md"
          cat "$RUNNER_TEMP/annual-npm-audit-pr.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: annual-website-dependencies
          if-no-files-found: error
          path: |
            ${{ env.WEBSITE_PROJECT }}/package.json
            ${{ env.WEBSITE_PROJECT }}/pnpm-lock.yaml
            ${{ env.WEBSITE_PROJECT }}/pnpm-workspace.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: annual-website-audit-report
          if-no-files-found: error
          path: ${{ runner.temp }}/annual-npm-audit-pr.md

  pull-request:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: annual-website-dependencies
          path: ${{ env.WEBSITE_PROJECT }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: annual-website-audit-report
          path: ${{ runner.temp }}
      - name: Open or update the umbrella PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: maintenance/annual-website-dependencies
          PR_TITLE: 'Annual documentation dependencies: best-effort upgrade drive'
          PR_FOOTER: |
            Review major-version changes and retained overrides, and approve the normal
            PR validation workflows before merging. Nothing is merged automatically.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          expected_head=$(git rev-parse --verify "refs/remotes/origin/$PR_BRANCH" 2>/dev/null || true)
          body_file="$RUNNER_TEMP/annual-npm-audit-pr.md"
          printf '\n%s\n' "$PR_FOOTER" >> "$body_file"
          pr_number=$(gh pr list --state open --head "$PR_BRANCH" --base "$BASE_BRANCH" --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          git checkout -B "$PR_BRANCH"
          git add -- "$WEBSITE_PROJECT/package.json"
          for file in pnpm-lock.yaml pnpm-workspace.yaml; do
            if [ -f "$WEBSITE_PROJECT/$file" ]; then
              git add -- "$WEBSITE_PROJECT/$file"
            fi
          done
          if git diff --cached --quiet; then
            if [ -z "$pr_number" ]; then
              echo 'No dependency changes; see the Actions run summary for the audit report.'
              exit 0
            fi
            printf '\nThis run produced no dependency changes relative to `%s`. The existing PR branch was left unchanged; the audit above describes this run.\n' "$BASE_BRANCH" >> "$body_file"
          else
            git commit -m 'Annual documentation dependency audit and upgrades'
            git push --force-with-lease="refs/heads/$PR_BRANCH:$expected_head" origin "HEAD:refs/heads/$PR_BRANCH"
          fi
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$PR_TITLE" --body-file "$body_file"
          else
            gh pr create --head "$PR_BRANCH" --base "$BASE_BRANCH" --title "$PR_TITLE" --body-file "$body_file"
          fi
