# This workflow uploads Hydra to PyPI using Trusted Publishers
# Basics: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
# Security model: https://docs.pypi.org/trusted-publishers/security-model/
name: Publish to PyPI
run-name: >-
  Publish ${{ inputs.package_set }} ${{ inputs.expected_version || '<version not checked>' }}${{ inputs.commit && format(' @ {0}', inputs.commit) || '' }}
  (${{ inputs.publish && 'upload' || 'dry run' }})

on:
  workflow_dispatch:
    inputs:
      package_set:
        description: "Release package set"
        required: true
        type: choice
        default: hydra-full-release
        options:
          - hydra-core
          - hydra-plugins
          - hydra-full-release
          - configen
          - all
      only:
        description: "Optional comma-separated package config names from the selected set"
        required: false
        type: string
        default: ""
      expected_version:
        description: "Optional version to validate before publishing"
        required: false
        type: string
        default: ""
      commit:
        description: "Full commit SHA to publish. Leave empty to pin the dispatched branch tip."
        required: false
        type: string
        default: ""
      publish:
        description: "Publish to PyPI after building artifacts"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Use separate jobs for planning, building, and publishing so that write
# permissions are only accessible to the publishing job.
#
# Artifact building runs before approval. Only the publishing job uses the
# pypi-publish environment, so its required review gates the actual upload.
jobs:
  release-plan:
    name: Validate release plan
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      expected_version: ${{ steps.plan.outputs.expected_version }}
      package_set: ${{ steps.plan.outputs.package_set }}
      publish_enabled: ${{ steps.plan.outputs.publish_enabled }}
      only: ${{ steps.plan.outputs.only }}
    steps:
    - name: Derive publish plan
      id: plan
      env:
        REF_NAME: ${{ github.ref_name }}
        HEAD_SHA: ${{ github.sha }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_PACKAGE_SET: ${{ inputs.package_set }}
        INPUT_ONLY: ${{ inputs.only }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected_version }}
        INPUT_PUBLISH: ${{ inputs.publish }}
      run: |
        python <<'PY'
        import os
        import re
        import sys

        ref_name = os.environ["REF_NAME"]
        head_sha = os.environ["HEAD_SHA"]
        input_commit = os.environ["INPUT_COMMIT"].strip()
        input_package_set = os.environ["INPUT_PACKAGE_SET"].strip()
        input_only = os.environ["INPUT_ONLY"].strip()
        input_expected_version = os.environ["INPUT_EXPECTED_VERSION"].strip()
        input_publish = os.environ["INPUT_PUBLISH"].strip()

        def fail(message: str) -> None:
            print(f"::error::{message}")
            sys.exit(1)

        package_set = input_package_set or "hydra-full-release"

        # Publishing is pinned to an immutable commit so that pushes landing
        # after dispatch, including while the run waits for environment
        # approval, cannot change what gets built and uploaded.
        if input_commit and not re.fullmatch(r"[0-9a-f]{40}", input_commit):
            fail(
                "commit must be a full 40-character lowercase SHA; "
                f"got {input_commit!r}"
            )
        checkout_ref = input_commit or head_sha
        expected_version = input_expected_version
        publish_enabled = "true" if input_publish.lower() == "true" else "false"

        if expected_version and not re.fullmatch(
            r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
            r"(?:(?:rc\d+)|(?:\.dev\d+))?",
            expected_version,
        ):
            fail(
                "expected_version must look like 1.4.0.dev2, 1.4.0rc1, "
                f"1.4.0, or 1.4.1; got {expected_version!r}"
            )

        if input_only and not re.fullmatch(
            r"[A-Za-z0-9_]+(?:,[A-Za-z0-9_]+)*", input_only
        ):
            fail(
                "only must be a comma-separated list of package config names, "
                f"got {input_only!r}"
            )

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            print(f"checkout_ref={checkout_ref}", file=output)
            print(f"expected_version={expected_version}", file=output)
            print(f"package_set={package_set}", file=output)
            print(f"publish_enabled={publish_enabled}", file=output)
            print(f"only={input_only}", file=output)

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            print("## Publish plan", file=summary)
            print("", file=summary)
            print(f"- Package set: `{package_set}`", file=summary)
            if input_only:
                print(f"- Package filter: `{input_only}`", file=summary)
            print(f"- Dispatched ref: `{ref_name}`", file=summary)
            pin_source = "commit input" if input_commit else "branch tip at dispatch"
            print(
                f"- Checkout commit: `{checkout_ref}` ({pin_source})",
                file=summary,
            )
            version = expected_version or "<not provided>"
            print(f"- Expected version: `{version}`", file=summary)
            print(f"- Publish enabled: `{publish_enabled}`", file=summary)
        PY

  build-artifacts:
    name: Build distribution artifacts
    needs: release-plan
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload-artifacts.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ needs.release-plan.outputs.checkout_ref }}

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/requirements.txt build packaging read-version requests twine

    - name: Generate parser sources
      run: python setup.py antlr

    - name: Validate prepared package versions
      if: ${{ needs.release-plan.outputs.expected_version != '' }}
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python tools/release/release.py \
          action=validate_versions \
          set=${{ needs.release-plan.outputs.package_set }} \
          only="'${{ needs.release-plan.outputs.only }}'" \
          version=${{ needs.release-plan.outputs.expected_version }}

    - name: Build distributions
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python tools/release/release.py \
          action=build \
          set=${{ needs.release-plan.outputs.package_set }} \
          only="'${{ needs.release-plan.outputs.only }}'" \
          repository=pypi \
          clean_build_dir=true \
          require_artifacts=true \
          build_dir="${{ github.workspace }}/dist"

    - name: Verify build artifacts
      run: |
        ls -lah dist/
        twine check dist/*

    - name: Smoke install built wheels
      run: |
        python -m venv smoke-venv
        smoke-venv/bin/python -m pip install --upgrade pip
        smoke-venv/bin/python -m pip install --no-deps dist/*.whl

    - name: Write release summary
      env:
        PUBLISH_ENABLED: ${{ needs.release-plan.outputs.publish_enabled }}
        CHECKOUT_COMMIT: ${{ needs.release-plan.outputs.checkout_ref }}
        PACKAGE_SET: ${{ needs.release-plan.outputs.package_set }}
        ONLY: ${{ needs.release-plan.outputs.only }}
        EXPECTED_VERSION: ${{ needs.release-plan.outputs.expected_version }}
        TARGET_REPOSITORY: PyPI
      run: |
        if [[ "${PUBLISH_ENABLED}" == "true" ]]; then
          mode="publish"
          outcome="Artifacts will be uploaded to ${TARGET_REPOSITORY}."
        else
          mode="dry run"
          outcome="Artifacts were built and checked only; no upload will run."
        fi

        {
          echo "## Release summary"
          echo
          echo "- Target repository: ${TARGET_REPOSITORY}"
          echo "- Mode: ${mode}"
          echo "- Package set: \`${PACKAGE_SET}\`"
          if [[ -n "${ONLY}" ]]; then
            echo "- Package filter: \`${ONLY}\`"
          fi
          if [[ -n "${EXPECTED_VERSION}" ]]; then
            echo "- Expected version: \`${EXPECTED_VERSION}\`"
          fi
          echo "- Trigger: ${GITHUB_EVENT_NAME}"
          echo "- Ref: \`${GITHUB_REF_NAME}\`"
          echo "- Commit: \`${CHECKOUT_COMMIT}\`"
          echo "- Outcome: ${outcome}"
          echo
          echo "### Artifacts"
          echo
          echo "| Artifact | Size |"
          echo "| --- | ---: |"
          find dist -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort \
            | while IFS=$'\t' read -r artifact bytes; do
                size="$(numfmt --to=iec --suffix=B "${bytes}")"
                echo "| \`${artifact}\` | ${size} |"
              done
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist
        path: dist/
        retention-days: 7

  pypi-publish:
    needs:
      - release-plan
      - build-artifacts
    name: Upload release to PyPI
    if: ${{ needs.release-plan.outputs.publish_enabled == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: read
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: dist
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  cleanup-artifact:
    name: Delete transient distribution artifact
    needs:
      - build-artifacts
      - pypi-publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Delete build artifact
      continue-on-error: true
      env:
        ARTIFACT_ID: ${{ needs.build-artifacts.outputs.artifact_id }}
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh api --method DELETE
        "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
